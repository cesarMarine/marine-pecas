<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Vendedor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .header-top h1 { color: #1a237e; font-size: 24px; }
        .btn-voltar {
            background: #e0e0e0;
            padding: 8px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: #1a1a2e;
            font-weight: 600;
        }
        .btn-voltar:hover { background: #ccc; }
        .filtros {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filtros select, .filtros input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .filtros button {
            padding: 10px 20px;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .filtros button:hover { background: #0d1555; }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }
        th {
            background: #f5f5f5;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .status-aguardando { background: #fff3cd; color: #856404; }
        .status-analise { background: #cce5ff; color: #004085; }
        .status-orcamento { background: #d4edda; color: #155724; }
        .status-enviado { background: #d1ecf1; color: #0c5460; }
        .status-finalizado { background: #d4edda; color: #155724; }
        .status-cancelado { background: #f8d7da; color: #721c24; }
        .status-reprovado { background: #f8d7da; color: #721c24; }
        
        .btn-acao {
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: 0.3s;
            margin: 2px;
            white-space: nowrap;
        }
        .btn-analise { background: #0984e3; color: white; }
        .btn-analise:hover { background: #0652DD; }
        .btn-cliente { background: #1a237e; color: white; }
        .btn-cliente:hover { background: #0d1555; }
        .btn-detalhes { background: #6c5ce7; color: white; }
        .btn-detalhes:hover { background: #5a4bd1; }
        .btn-aprovar { background: #00b894; color: white; }
        .btn-aprovar:hover { background: #00a381; }
        .btn-reprovar { background: #f39c12; color: white; }
        .btn-reprovar:hover { background: #e67e22; }
        .btn-cancelar { background: #e94560; color: white; }
        .btn-cancelar:hover { background: #c62828; }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal h2 { color: #1a237e; margin-bottom: 20px; }
        .modal .info-cliente {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .modal .info-cliente p { margin: 5px 0; font-size: 13px; }
        .modal .info-cliente strong { color: #1a237e; }
        .modal table { font-size: 12px; }
        .modal table th { background: #e8eaf6; }
        .modal .btn-fechar {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal .btn-fechar:hover { background: #bdbdbd; }
        .modal .btn-enviar {
            background: #1a237e;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            margin-left: 10px;
        }
        .modal .btn-enviar:hover { background: #0d1555; }
        
        .empty {
            text-align: center;
            color: #888;
            padding: 40px;
        }
        .scroll-table {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .produto-tag {
            background: #1a237e;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            margin-right: 3px;
        }
        .variacao-tag {
            background: #e8eaf6;
            color: #1a237e;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .grupo-produto-modal {
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .grupo-produto-modal .grupo-header {
            background: #e8eaf6;
            padding: 8px 15px;
            font-weight: 600;
            color: #1a237e;
        }
        .grupo-produto-modal .grupo-itens {
            padding: 5px 15px;
        }
        
        @media (max-width: 768px) {
            .container { padding: 0; }
            .card { padding: 15px; }
            .filtros { flex-direction: column; }
            table { font-size: 11px; }
            th, td { padding: 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>📋 Painel do Vendedor</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="total-pedidos" style="font-size: 14px; color: #666;">Carregando...</span>
                <a href="/admin" class="btn-voltar">← Voltar</a>
            </div>
        </div>

        <div class="card">
            <div class="filtros">
                <select id="filtro-status" onchange="carregarPedidos()">
                    <option value="">Todos os Status</option>
                    <option value="AGUARDANDO">⏳ Aguardando</option>
                    <option value="EM_ANALISE_TECNICA">🔧 Em Análise Técnica</option>
                    <option value="ORCAMENTO_FINALIZADO">📊 Orçamento Pronto</option>
                    <option value="ENVIADO_CLIENTE">📨 Enviado ao Cliente</option>
                    <option value="CONFIRMADO_TECNICO">✅ Confirmado</option>
                    <option value="ORCAMENTO_RECUSADO">❌ Reprovado</option>
                    <option value="FINALIZADO">✅ Finalizado</option>
                    <option value="CANCELADO">❌ Cancelado</option>
                </select>
                <input type="text" id="filtro-busca" placeholder="🔍 Buscar por cliente ou chamado..." oninput="carregarPedidos()">
                <button onclick="carregarPedidos()">🔄 Atualizar</button>
            </div>

            <div class="scroll-table">
                <table>
                    <thead>
                        <tr>
                            <th>Chamado</th>
                            <th>Cliente</th>
                            <th>Status</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pedidos">
                        <tr><td colspan="5" class="empty">Carregando pedidos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-detalhes">
        <div class="modal" id="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        let pedidos = [];

        async function carregarPedidos() {
            const status = document.getElementById('filtro-status').value;
            const busca = document.getElementById('filtro-busca').value.trim();
            const tbody = document.getElementById('tabela-pedidos');
            const totalSpan = document.getElementById('total-pedidos');

            tbody.innerHTML = '<tr><td colspan="5" class="empty">⏳ Carregando...</td></tr>';

            try {
                let url = '/api/pedidos';
                const params = new URLSearchParams();
                if (status) params.append('status', status);
                if (busca) params.append('busca', busca);
                if (params.toString()) url += '?' + params.toString();

                const res = await fetch(url);
                const data = await res.json();

                if (!data.success) {
                    tbody.innerHTML = `<tr><td colspan="5" class="empty">❌ ${data.error}</td></tr>`;
                    return;
                }

                pedidos = data.pedidos;
                totalSpan.textContent = `${pedidos.length} pedido(s)`;

                if (pedidos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty">📭 Nenhum pedido encontrado</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                pedidos.forEach(p => {
                    const tr = document.createElement('tr');
                    const statusClass = getStatusClass(p.status);
                    const statusLabel = getStatusLabel(p.status);

                    tr.innerHTML = `
    <td><strong>${p.numero_chamado}</strong></td>
    <td>
        ${p.cliente_nome}
        ${p.numero_cliente ? `<br><span style="background:#e8eaf6; color:#1a237e; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700;">Nº ${p.numero_cliente}</span>` : ''}
    </td>
    <td>
        <span class="status ${statusClass}">${statusLabel}</span>
        ${p.status_separado ? `<br><span class="status" style="background:#6c5ce7; color:white; margin-top:4px;">📦 Separado</span>` : ''}
    </td>
    <td>${formatarData(p.data_pedido)}</td>
    <td>
        <button class="btn-acao btn-detalhes" onclick="verDetalhes(${p.id})">📄 Detalhes</button>
        
        ${p.status === 'AGUARDANDO' ? `<button class="btn-acao btn-analise" onclick="enviarParaTecnico(${p.id})">🔧 Enviar Técnico</button>` : ''}
        
        ${p.status === 'ORCAMENTO_FINALIZADO' ? `
            <button class="btn-acao btn-aprovar" onclick="aprovarOrcamento(${p.id})">✅ Aprovar</button>
            <button class="btn-acao btn-reprovar" onclick="reprovarOrcamento(${p.id})">❌ Reprovar</button>
            <button class="btn-acao btn-cancelar" onclick="deletarPedido(${p.id})">🗑️ Deletar</button>
        ` : ''}
        
        ${p.status === 'ENVIADO_CLIENTE' ? `<button class="btn-acao btn-aprovar" onclick="confirmarComTecnico(${p.id})">✅ OK Técnico</button>` : ''}
        
        ${p.status === 'CANCELADO' ? `<button class="btn-acao btn-cancelar" onclick="deletarPedido(${p.id})">🗑️ Deletar</button>` : ''}
    </td>
`;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty">❌ Erro: ${error.message}</td></tr>`;
            }
        }

        function getStatusClass(status) {
            const map = {
                'AGUARDANDO': 'status-aguardando',
                'EM_ANALISE_TECNICA': 'status-analise',
                'ORCAMENTO_FINALIZADO': 'status-orcamento',
                'ENVIADO_CLIENTE': 'status-enviado',
                'CONFIRMADO_TECNICO': 'status-finalizado',
                'ORCAMENTO_RECUSADO': 'status-reprovado',
                'FINALIZADO': 'status-finalizado',
                'CANCELADO': 'status-cancelado'
            };
            return map[status] || 'status-aguardando';
        }

        function getStatusLabel(status) {
    const map = {
        'AGUARDANDO': '⏳ Aguardando',
        'EM_ANALISE_TECNICA': '🔧 Em Análise',
        'ORCAMENTO_FINALIZADO': '📊 Orçamento Pronto',
        'ENVIADO_CLIENTE': '📨 Enviado ao Cliente',
        'CONFIRMADO_TECNICO': '✅ Confirmado',
        'ORCAMENTO_RECUSADO': '❌ Reprovado',
        'FINALIZADO': '✅ Finalizado',
        'CANCELADO': '❌ Cancelado',
        'SEPARADO': '📦 Separado'
    };
    return map[status] || status;
}

        function formatarData(data) {
            if (!data) return '-';
            const d = new Date(data);
            return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        async function verDetalhes(id) {
            const modal = document.getElementById('modal-detalhes');
            const body = document.getElementById('modal-body');

            try {
                const res = await fetch(`/api/pedidos/${id}`);
                const data = await res.json();

                if (!data.success) {
                    body.innerHTML = `<p class="empty">❌ ${data.error}</p>`;
                    modal.classList.add('active');
                    return;
                }

                const p = data.pedido;
                const itens = p.itens || [];
                const statusLabel = getStatusLabel(p.status);

                let html = `
                    <h2>📄 Pedido #${p.numero_chamado}</h2>
                    
                    <div class="info-cliente">
    <p><strong>Status:</strong> <span class="status ${getStatusClass(p.status)}">${statusLabel}</span>${p.status_separado ? ' <span class="status" style="background:#6c5ce7;color:white;">📦 Separado</span>' : ''}</p>
    <p><strong>Cliente:</strong> ${p.cliente_nome}</p>
    ${p.numero_cliente ? `<p><strong>🔢 Nº Cliente:</strong> <span style="background:#e8eaf6; color:#1a237e; padding:3px 10px; border-radius:10px; font-weight:700;">${p.numero_cliente}</span></p>` : ''}
                        <p><strong>CNPJ:</strong> ${p.cliente_cnpj}</p>
                        ${p.cliente_telefone ? `<p><strong>Telefone:</strong> ${p.cliente_telefone}</p>` : ''}
                        ${p.cliente_email ? `<p><strong>E-mail:</strong> ${p.cliente_email}</p>` : ''}
                        ${p.cliente_endereco ? `<p><strong>Endereço:</strong> ${p.cliente_endereco}</p>` : ''}
                        <p><strong>Vendedor:</strong> ${p.vendedor_nome || '-'}</p>
                        <p><strong>Data:</strong> ${formatarData(p.data_pedido)}</p>
                    </div>

                    <h3>📋 Peças Solicitadas</h3>
                `;

                const grupos = {};
                itens.forEach(item => {
                    const chave = `${item.manual_nome || 'Produto'}|${item.variacao || 'N/A'}`;
                    if (!grupos[chave]) {
                        grupos[chave] = {
                            manual_nome: item.manual_nome || 'Produto',
                            variacao: item.variacao || 'N/A',
                            itens: []
                        };
                    }
                    grupos[chave].itens.push(item);
                });

                Object.keys(grupos).forEach(chave => {
                    const grupo = grupos[chave];
                    html += `
                        <div class="grupo-produto-modal">
                            <div class="grupo-header">
                                📦 ${grupo.manual_nome} ${grupo.variacao ? `(📏 ${grupo.variacao})` : ''}
                            </div>
                            <div class="grupo-itens">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Posição</th>
                                            <th>Descrição</th>
                                            <th style="text-align:center;">Qtd</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;

                    grupo.itens.forEach(item => {
                        html += `
                            <tr>
                                <td><strong>#${item.numero}</strong></td>
                                <td>${item.nome}</td>
                                <td style="text-align:center;">${item.qtd}</td>
                            </tr>
                        `;
                    });

                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                });

                if (p.orcamento && p.orcamento.length > 0) {
                    let totalGeral = 0;
                    html += `
                        <h3 style="margin-top:20px;">📊 Orçamento Técnico</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Descrição</th>
                                    <th style="text-align:center;">Qtd</th>
                                    <th style="text-align:right;">Preço Unit.</th>
                                    <th style="text-align:right;">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    p.orcamento.forEach(item => {
                        const total = (item.preco_unitario || 0) * (item.qtd || 0);
                        totalGeral += total;
                        html += `
                            <tr>
                                <td>${item.codigo || '-'}</td>
                                <td>${item.descricao || '-'}</td>
                                <td style="text-align:center;">${item.qtd || 0}</td>
                                <td style="text-align:right;">R$ ${(item.preco_unitario || 0).toFixed(2)}</td>
                                <td style="text-align:right;">R$ ${total.toFixed(2)}</td>
                            </tr>
                        `;
                    });

                    html += `
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="4" style="text-align:right; font-weight:bold; font-size:16px;">TOTAL:</td>
                                    <td style="text-align:right; font-weight:bold; font-size:16px; color:#1a237e;">R$ ${totalGeral.toFixed(2)}</td>
                                </tr>
                            </tfoot>
                        </table>
                    `;
                }

                html += `
                    <div style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
                        <button class="btn-fechar" onclick="fecharModal()">🔙 Fechar</button>
                        
                        ${p.status === 'AGUARDANDO' ? `<button class="btn-enviar" onclick="enviarParaTecnico(${p.id})">🔧 Enviar para Técnico</button>` : ''}
                        
                        ${p.status === 'ORCAMENTO_FINALIZADO' ? `
                            <button class="btn-enviar" style="background:#00b894;" onclick="aprovarOrcamento(${p.id})">✅ Aprovar</button>
                            <button class="btn-enviar" style="background:#f39c12;" onclick="reprovarOrcamento(${p.id})">❌ Reprovar</button>
                            <button class="btn-enviar" style="background:#e94560;" onclick="deletarPedido(${p.id})">🗑️ Deletar</button>
                        ` : ''}
                        
                        ${p.status === 'ENVIADO_CLIENTE' ? `<button class="btn-enviar" style="background:#00b894;" onclick="confirmarComTecnico(${p.id})">✅ OK Técnico</button>` : ''}
                    </div>
                `;

                body.innerHTML = html;
                modal.classList.add('active');

            } catch (error) {
                body.innerHTML = `<p class="empty">❌ Erro: ${error.message}</p>`;
                modal.classList.add('active');
            }
        }

        function fecharModal() {
            document.getElementById('modal-detalhes').classList.remove('active');
        }

        async function enviarParaTecnico(id) {
    // Busca dados do pedido para mostrar
    const pedido = pedidos.find(p => p.id === id);
    const nomeCliente = pedido ? pedido.cliente_nome : 'Cliente';
    const numeroAtual = pedido?.numero_cliente || '';
    
    // 🔥 MODAL CUSTOMIZADO
    const modalHtml = `
        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;" id="modal-numero-cliente">
            <div style="background:white; padding:30px; border-radius:16px; max-width:450px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.4);">
                <h2 style="color:#1a237e; margin-bottom:10px;">📤 Enviar para Análise Técnica</h2>
                <p style="color:#666; font-size:14px; margin-bottom:20px;">
                    Cliente: <strong>${nomeCliente}</strong>
                </p>
                
                <label style="display:block; font-weight:700; color:#1a237e; margin-bottom:8px;">
                    🔢 Número do Cliente <span style="color:#e94560;">*</span>
                </label>
                <p style="font-size:12px; color:#888; margin-bottom:8px;">
                    Este número é essencial para o técnico enviar as peças corretas.
                </p>
                <input type="number" 
                       id="input-numero-cliente" 
                       value="${numeroAtual}"
                       placeholder="Ex: 4521"
                       min="1"
                       step="1"
                       style="width:100%; padding:15px; font-size:22px; text-align:center; border:2px solid #ddd; border-radius:8px; font-weight:700; letter-spacing:2px; margin-bottom:10px;">
                
                <div id="erro-numero" style="color:#e94560; font-size:13px; font-weight:600; min-height:20px; text-align:center; margin-bottom:10px;"></div>
                
                <div style="display:flex; gap:10px;">
                    <button onclick="fecharModalNumero()" 
                            style="flex:1; padding:12px; background:#e0e0e0; color:#333; border:none; border-radius:8px; cursor:pointer; font-weight:700; font-size:14px; font-family:inherit;">
                        ❌ Cancelar
                    </button>
                    <button onclick="confirmarEnvioTecnico(${id})" 
                            style="flex:1; padding:12px; background:#1a237e; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:700; font-size:14px; font-family:inherit;">
                        ✅ Confirmar
                    </button>
                </div>
            </div>
        </div>
    `;
    
    // Remove modal anterior se existir
    const antigo = document.getElementById('modal-numero-cliente');
    if (antigo) antigo.remove();
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    // Foca no input
    setTimeout(() => {
        const input = document.getElementById('input-numero-cliente');
        if (input) {
            input.focus();
            input.select();
        }
    }, 200);
    
    // Enter para confirmar
    setTimeout(() => {
        const input = document.getElementById('input-numero-cliente');
        if (input) {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') confirmarEnvioTecnico(id);
            });
        }
    }, 300);
}

function fecharModalNumero() {
    const modal = document.getElementById('modal-numero-cliente');
    if (modal) modal.remove();
}

async function confirmarEnvioTecnico(id) {
    const input = document.getElementById('input-numero-cliente');
    const erroDiv = document.getElementById('erro-numero');
    const numero = input.value.trim();
    
    // 🔥 VALIDAÇÃO
    if (!numero) {
        erroDiv.textContent = '⚠️ Digite o número do cliente!';
        input.focus();
        return;
    }
    
    if (!/^\d+$/.test(numero) || parseInt(numero) <= 0) {
        erroDiv.textContent = '⚠️ Digite apenas números inteiros!';
        input.focus();
        input.select();
        return;
    }
    
    // 🔥 CONFIRMAÇÃO
    if (!confirm(`Confirma que o número do cliente é ${numero}?`)) {
        input.focus();
        input.select();
        return;
    }
    
    const numeroInt = parseInt(numero);
    
    try {
        // 1. Salva o número do cliente
        const resNum = await fetch(`/api/pedidos/${id}/numero-cliente`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ numero_cliente: numeroInt })
        });
        
        const dataNum = await resNum.json();
        if (!dataNum.success) {
            erroDiv.textContent = '❌ Erro ao salvar: ' + dataNum.error;
            return;
        }
        
        // 2. Envia para análise técnica
        const res = await fetch(`/api/pedidos/${id}/status`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'EM_ANALISE_TECNICA' })
        });
        
        const data = await res.json();
        if (data.success) {
            alert(`✅ Pedido enviado para o técnico!\nNº Cliente: ${numero}`);
            fecharModalNumero();
            fecharModal();
            carregarPedidos();
        } else {
            erroDiv.textContent = '❌ ' + data.error;
        }
    } catch (error) {
        erroDiv.textContent = '❌ Erro: ' + error.message;
    }
}

        async function aprovarOrcamento(id) {
            if (!confirm('Aprovar este orçamento?')) return;

            try {
                const res = await fetch(`/api/pedidos/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'ENVIADO_CLIENTE' })
                });

                const data = await res.json();
                if (data.success) {
                    alert('✅ Orçamento aprovado e enviado para o cliente!');
                    fecharModal();
                    carregarPedidos();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                alert('❌ Erro: ' + error.message);
            }
        }

        async function reprovarOrcamento(id) {
            const motivo = prompt('Digite o motivo da reprovação (opcional):');
            if (motivo === null) return;

            if (!confirm('Reprovar este orçamento? O técnico será notificado para ajustar.')) return;

            try {
                const res = await fetch(`/api/pedidos/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'ORCAMENTO_RECUSADO', motivo_recusa: motivo })
                });

                const data = await res.json();
                if (data.success) {
                    alert('❌ Orçamento reprovado!');
                    fecharModal();
                    carregarPedidos();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                alert('❌ Erro: ' + error.message);
            }
        }

        async function deletarPedido(id) {
            if (!confirm('🗑️ Tem certeza que deseja DELETAR este pedido permanentemente?')) return;

            try {
                const res = await fetch(`/api/pedidos/${id}`, {
                    method: 'DELETE'
                });

                const data = await res.json();
                if (data.success) {
                    alert('✅ Pedido deletado com sucesso!');
                    fecharModal();
                    carregarPedidos();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                alert('❌ Erro: ' + error.message);
            }
        }

        async function confirmarComTecnico(id) {
            if (!confirm('Confirmar com o técnico que este orçamento foi enviado ao cliente?')) return;

            try {
                const res = await fetch(`/api/pedidos/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'CONFIRMADO_TECNICO' })
                });

                const data = await res.json();
                if (data.success) {
                    alert('✅ Orçamento confirmado com o técnico!');
                    fecharModal();
                    carregarPedidos();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                alert('❌ Erro: ' + error.message);
            }
        }

        document.getElementById('modal-detalhes').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) fecharModal();
        });

        document.addEventListener('DOMContentLoaded', carregarPedidos);
    </script>
